<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard – AnimVerse AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
  <style>
    :root {
      --dash-bg: #0b0f19;
      --dash-card: rgba(255, 255, 255, 0.05);
      --dash-border: rgba(255, 255, 255, 0.1);
      --dash-primary: #38bdf8;
      --dash-accent: #a855f7;
      --dash-text: #f8fafc;
      --dash-muted: #94a3b8;
    }
    body {
      background: var(--dash-bg);
      color: var(--dash-text);
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 260px;
      background: var(--dash-card);
      border-right: 1px solid var(--dash-border);
      backdrop-filter: blur(16px);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      font-weight: 800;
      color: white;
      margin-bottom: 40px;
      text-decoration: none;
    }
    .brand span {
      background: linear-gradient(135deg, var(--dash-primary), var(--dash-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-item {
      padding: 12px 16px;
      border-radius: 8px;
      color: var(--dash-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(56, 189, 248, 0.1);
      color: var(--dash-primary);
    }
    .main-content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      height: 100vh;
      background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.05), transparent 40%);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin: 0;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--dash-card);
      padding: 8px 16px;
      border-radius: 50px;
      border: 1px solid var(--dash-border);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid var(--dash-border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 20px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .stat-card:hover { 
      transform: translateY(-5px); 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-color: rgba(255,255,255,0.2); 
    }
    .stat-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      background: rgba(255, 255, 255, 0.05);
    }
    .stat-info h3 { margin: 0; font-size: 0.95rem; color: var(--dash-muted); font-weight: 500; }
    .stat-info p { margin: 4px 0 0; font-size: 2rem; font-weight: 800; color: white; }
    
    .section-title { font-size: 1.4rem; margin-bottom: 20px; color: white; font-weight: 700; }
    .content-container {
      background: var(--dash-card);
      border: 1px solid var(--dash-border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
      display: none;
    }
    .content-container.active {
      display: block;
      animation: slideUp 0.4s ease-out;
    }
    
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    
    .item-card {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--dash-border);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.3s;
    }
    .item-card:hover {
      border-color: var(--dash-primary);
      background: rgba(56, 189, 248, 0.05);
    }
    .item-card h4 { margin: 0 0 8px 0; font-size: 1.1rem; color: white; }
    .item-card p { margin: 0 0 16px 0; font-size: 0.9rem; color: var(--dash-muted); }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(255,255,255,0.1);
    }
    .badge.completed { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .badge.processing { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    
    .btn-logout {
      margin-top: auto;
      padding: 12px;
      border-radius: 10px;
      background: transparent;
      color: var(--dash-muted);
      border: 1px solid var(--dash-border);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.05); color: white; }
    
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--dash-bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      color: white; font-size: 1.5rem; flex-direction: column; gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: var(--dash-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--dash-muted);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div>Loading your workspace...</div>
  </div>

  <aside class="sidebar">
    <a href="index.html" class="brand">
      🎬 <span>AnimVerse</span>
    </a>
    <a class="nav-item active" onclick="showTab('overview')">
      <i class="fas fa-home"></i> Overview
    </a>
    <a class="nav-item" onclick="showTab('projects')">
      <i class="fas fa-video"></i> My Projects
    </a>
    <a class="nav-item" onclick="showTab('stories')">
      <i class="fas fa-book-open"></i> My Stories
    </a>
    
    <button class="btn-logout" onclick="logout()">
      <i class="fas fa-sign-out-alt"></i> Logout
    </button>
  </aside>

  <main class="main-content">
    <header class="header">
      <h1 id="greeting">Welcome back!</h1>
      <div class="user-profile">
        <i class="fas fa-user-astronaut" style="font-size: 1.5rem; color: var(--dash-primary);"></i>
        <span id="userName">User</span>
      </div>
    </header>

    <div class="content-container active" id="tab-overview">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon" style="color: #38bdf8; background: rgba(56, 189, 248, 0.1);"><i class="fas fa-video"></i></div>
          <div class="stat-info">
            <h3>Total Projects</h3>
            <p id="statProjects">0</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="color: #a855f7; background: rgba(168, 85, 247, 0.1);"><i class="fas fa-book"></i></div>
          <div class="stat-info">
            <h3>My Stories</h3>
            <p id="statStories">0</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="color: #22c55e; background: rgba(34, 197, 94, 0.1);"><i class="fas fa-download"></i></div>
          <div class="stat-info">
            <h3>Downloads</h3>
            <p id="statDownloads">0</p>
          </div>
        </div>
      </div>
      
      <h2 class="section-title" style="margin-top: 40px;">Recent Activity</h2>
      <div class="item-card" style="display: flex; align-items: center; justify-content: space-between;">
        <div>
          <h4>Welcome to AnimVerse AI!</h4>
          <p style="margin:0;">Start creating amazing animated stories today.</p>
        </div>
        <a href="index.html" class="badge" style="background: var(--dash-primary); color: #000; text-decoration: none; padding: 10px 20px;">Go to Generator</a>
      </div>
    </div>

    <div class="content-container" id="tab-projects">
      <h2 class="section-title">My Animation Projects</h2>
      <div class="grid-view" id="projectsGrid">
        <!-- Projects will be injected here -->
      </div>
    </div>

    <div class="content-container" id="tab-stories">
      <h2 class="section-title">My Stories</h2>
      <div class="grid-view" id="storiesGrid">
        <!-- Stories will be injected here -->
      </div>
    </div>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem('animverse_user') || 'null');
    const token = localStorage.getItem('animverse_token');

    if (!user || !token) {
      window.location.href = 'login.html';
    } else {
      document.getElementById('userName').textContent = user.name;
      document.getElementById('greeting').textContent = `Hello, ${user.name.split(' ')[0]}! 👋`;
      fetchUserData();
    }

    async function fetchUserData() {
      try {
        const response = await fetch('/api/user/dashboard', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await response.json();
        
        document.getElementById('loading').style.display = 'none';

        if (result.success) {
          populateDashboard(result.data);
        } else {
          alert('Failed to load data: ' + result.message);
          if (response.status === 401) logout();
        }
      } catch (error) {
        document.getElementById('loading').style.display = 'none';
        console.error('Error fetching dashboard:', error);
        alert('An error occurred while fetching data.');
      }
    }

    function populateDashboard(data) {
      // Stats
      document.getElementById('statProjects').textContent = data.stats.totalProjects;
      document.getElementById('statStories').textContent = data.stats.totalStories;
      document.getElementById('statDownloads').textContent = data.stats.downloads;

      // Projects Grid
      const projectsHtml = data.myProjects.length > 0 
        ? data.myProjects.map(p => `
          <div class="item-card">
            <h4>${p.title}</h4>
            <p>Style: ${p.animationStyle}</p>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="badge ${p.status === 'completed' ? 'completed' : p.status === 'processing' ? 'processing' : ''}">${p.status}</span>
              <span style="font-size: 0.8rem; color: var(--dash-muted);">${new Date(p.createdAt).toLocaleDateString()}</span>
            </div>
          </div>
        `).join('')
        : `<div class="empty-state" style="grid-column: 1 / -1;"><i class="fas fa-video-slash"></i><p>You haven't created any animation projects yet.</p></div>`;
      document.getElementById('projectsGrid').innerHTML = projectsHtml;

      // Stories Grid
      const storiesHtml = data.myStories.length > 0
        ? data.myStories.map(s => `
          <div class="item-card">
            <h4>${s.title}</h4>
            <p>Genre: ${s.genre || 'N/A'}</p>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="badge"><i class="fas fa-eye"></i> ${s.viewCount || 0}</span>
              <span style="font-size: 0.8rem; color: var(--dash-muted);">${new Date(s.createdAt).toLocaleDateString()}</span>
            </div>
          </div>
        `).join('')
        : `<div class="empty-state" style="grid-column: 1 / -1;"><i class="fas fa-book-dead"></i><p>You haven't added any stories yet.</p></div>`;
      document.getElementById('storiesGrid').innerHTML = storiesHtml;
    }

    function showTab(tabId) {
      document.querySelectorAll('.content-container').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabId}`).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function logout() {
      localStorage.removeItem('animverse_token');
      localStorage.removeItem('animverse_user');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
