services:
  - type: web
    name: aminverse-ai
    env: node
    plan: free
    buildCommand: npm install && cd client && npm install --include=dev && npx vite build && cd ..
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: POLLO_API_KEY
        sync: false
      - key: PIXAZO_API_KEY
        sync: false
